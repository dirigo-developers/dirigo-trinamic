[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dirigo_trinamic"
version = "0.2.0"
description = "Plugin to use Trinamic stepper motors with Dirigo."
authors = [
    {name = "T. D. Weber", email = "tweber@mit.edu"}
]
license = {text = "MIT"}
dependencies = [
    "dirigo",
    "pyserial" 
]

# deprecated
[project.entry-points."dirigo_scanners"]
trinamic_objective_z_scanner = "dirigo_trinamic:TrinamicObjectiveZScanner"

# new format
[project.entry-points."dirigo.devices.objective_actuator"]
trinamic = "dirigo_trinamic:TrinamicObjectiveZScanner"