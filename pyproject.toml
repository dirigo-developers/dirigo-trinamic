[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dirigo_trinamic"
version = "0.1.0"
description = "Plugin to use Trinamic stepper motoros with Dirigo."
authors = [
    {name = "T. D. Weber", email = "tweber@mit.edu"}
]
license = {text = "MIT"}
dependencies = [
    "pyserial" 
]

[project.entry-points."dirigo_scanners"]
trinamic_objective_z_scanner = "dirigo_trinamic:TrinamicObjectiveZScanner"